# Aura Mezmo Playground — agent configuration
#
# Single agent (no orchestration) wired to three MCP tool servers:
#   - mezmo:     hosted MCP for live log search/export (mcp.mezmo.com)
#   - logs:      local server exposing user-uploaded log files
#   - freshdesk: local server exposing Freshdesk ticket search
#
# Changes take effect after: docker compose restart aura

# Scratchpad storage location (must be writable inside the container).
# Required once [agent.scratchpad].enabled = true below.
memory_dir = "/tmp/aura-scratchpad"

[mcp]
sanitize_schemas = true

# ── Mezmo — live logs, via the production-only proxy ────────────────
# NOT https://mcp.mezmo.com/mcp directly. mezmo-proxy (services/mezmo-proxy)
# re-exposes 9 read-only log tools out of Mezmo's 32 and AND-injects
# `host:gen1-prod -level:debug` into every query, in Python, before the call
# leaves the network. That enforcement is not something this config or the
# system prompt below can relax -- and MEZMO_API_KEY is deliberately absent
# from the aura container (see docker-compose.yml), so there is no path
# around the proxy. No Authorization header is needed here: the proxy holds
# the credential and this hop is internal to the aura-mezmo network.
[mcp.servers.mezmo]
transport = "http_streamable"
url = "http://mezmo-proxy:8093/mcp"
description = "Live Mezmo log search over production robots (gen1-prod*), excluding DEBUG"

[mcp.servers.mezmo.scratchpad]
"*" = { min_tokens = 2000 }

# ── Uploaded logs — files a user drops in via the web UI ────────────
[mcp.servers.logs]
transport = "http_streamable"
url = "http://logs-mcp:8091/mcp"
description = "Search, read, and template-cluster log files uploaded through the web UI"

# Scratchpad interception thresholds are per-server and per-tool — enabling
# [agent.scratchpad] alone does nothing without these. "*" catches every
# tool this server exposes; a search over a session's worth of logs is
# exactly the kind of output this is meant to divert.
#
# This wildcard also covers the two newer tools (summarize_templates,
# lookup_template) without any extra entries, and that's deliberate, not
# an oversight: summarize_templates is already compact by construction
# (Drain3 collapsed the repetition before the tool even returns, capped
# further by its own `top` param), so it usually stays under 2000 tokens
# and Scratchpad rarely triggers for it. lookup_template is the opposite
# case on purpose -- a deliberate, scoped drill-down into full raw lines
# for one specific cluster, which can genuinely exceed 2000 tokens for a
# high-occurrence cluster. That's exactly the large-output-exploration
# case Scratchpad exists for, so leaving it under the same wildcard is
# correct rather than something to special-case around.
[mcp.servers.logs.scratchpad]
"*" = { min_tokens = 2000 }

# ── Freshdesk — bug ticket search ────────────────────────────────────
[mcp.servers.freshdesk]
transport = "http_streamable"
url = "http://freshdesk-mcp:8092/mcp"
description = "Search and read Freshdesk support tickets/bugs"

[agent]
name = "Aura Mezmo Playground"
alias = "aura-mezmo"
system_prompt = """
You are a log and bug triage assistant for the Aura Mezmo playground.
You have three tool sources:

1. `mezmo_*` — live log search against the user's Mezmo account, restricted
   to PRODUCTION robots (hosts named `gen1-prod*`) with DEBUG-level lines
   excluded. This restriction is enforced in the proxy, not by you: every
   query you send has `host:gen1-prod -level:debug` AND-ed onto it before it
   reaches Mezmo. Consequences worth knowing:
     - Do not add `host:gen1-prod` or `-level:debug` yourself; it is already
       there. Do narrow to a specific robot when the question names one
       (e.g. `host:gen1-prod17`).
     - Asking for a development robot (`gen1-dev*`), a prototype
       (`gen1-proto*`), or any non-gen1 host returns an explicit
       out-of-scope error. Relay that to the user plainly — it is a
       deliberate policy, not a malfunction, and retrying will not help.
     - DEBUG lines are invisible to you here. If a question can only be
       answered from DEBUG output, say so rather than guessing.
2. `logs_*` — search, read, and template-cluster log files the user has
   uploaded via the UI.
3. `freshdesk_*` — search Freshdesk support tickets (bugs).

For any "what's in this file" / "what happened" / "summarize this log"
question about an uploaded file, call `logs_summarize_templates` FIRST,
not `logs_read_log` or `logs_search_logs`. It clusters the file into
templates (Drain3) and returns one row per distinct event shape with a
count, affected apps/levels, a time range, and a couple of example
lines — repetition already collapsed out, at a fraction of the tokens
raw lines would cost. Use `by_app=true` when the file mixes a
high-volume app with lower-volume ones you don't want dominated (e.g. a
noisy sensor loop drowning out a rarer service's events). Use
`min_count`/`level` to narrow the summary before reading it, e.g. to
surface only ERROR-carrying templates or only routine (high-count)
behavior.

Each row from `logs_summarize_templates` carries a `cluster_id`.
If you need every real occurrence of one specific row — not just its
capped example lines and timestamps — call `logs_lookup_template` with
that same `cluster_id` (and the same `by_app`/`group` it came from).
Reach for this when a template's count is low enough that every instance
plausibly matters, when you need to quote an exact line for an answer,
or when the user asks to drill into one specific event shape by name.

`logs_read_log`/`logs_search_logs` are still the right tools for
line-range reads and free-text substring search — use them when the
question isn't about the file's overall shape (e.g. "does this file
contain the string X anywhere").

When asked to investigate an issue or a Freshdesk ticket, correlate
across whichever sources are relevant: pull the ticket details, search
uploaded and/or live logs for matching timestamps, error strings, or
service names, and summarize root cause with supporting evidence
(quote the specific log lines and cite the ticket number).

If the request includes explicit filters — a time window, a service or
keyword, a log level, a specific line range — treat those as hard
constraints, not suggestions. Pass them straight into the tool calls
(e.g. logs_read_log's offset/limit, logs_search_logs's pattern, or the
equivalent bounds on the Mezmo query) rather than re-deriving your own
filters, and say explicitly if nothing matched within the given bounds.

Be concise. Always say which tool/source a fact came from.
"""
# Raised from the original default of 5-8: an exhaustive sweep across a
# skill's full keyword reference (e.g. robot-shift-notes covers ~15
# categories) easily takes 15-20+ tool calls before synthesis. Scratchpad
# (below) adds its own turn_depth_bonus on top of this.
turn_depth = 30

[agent.llm]
provider = "{{ env.LLM_PROVIDER }}"
api_key = "{{ env.LLM_API_KEY }}"
model = "{{ env.LLM_MODEL }}"
# Context window for the configured model, in tokens. Required for
# scratchpad (below). 200000 matches Claude Sonnet's standard window —
# update this if you change LLM_MODEL to something with a different limit.
context_window = 200000

# ── Scratchpad ──────────────────────────────────────────────────────
# Lets the agent explore large tool outputs (e.g. searching a full day of
# logs) incrementally — via grep/slice/head-style exploration tools —
# instead of pulling the entire result into context at once. Without this,
# a big enough search result can overflow the context window and the
# request errors out with nothing produced.
[agent.scratchpad]
enabled = true

# ── Skills ──────────────────────────────────────────────────────────
# Local skill sources: directories of SKILL.md-based instructions the
# agent can load on demand (see config/skills/). Path is inside the
# aura container — mounted from ./config/skills in docker-compose.yml.
[[agent.skills.local]]
source = "/app/skills"
