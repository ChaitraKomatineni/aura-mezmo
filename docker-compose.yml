services:
  # ── Aura Agent Server ──────────────────────────────────────────────
  aura:
    image: mezmo/aura:latest
    pull_policy: always
    container_name: aura-mezmo-agent
    command:
      - ./aura-web-server
      - --verbose
    ports:
      # Host 8081, not 8080: the separate `aura` quickstart stack (compose
      # project "aura", /home/chaitra/aura) binds host 8080 with
      # restart: unless-stopped, so this container could never come up.
      # Only the host side moves -- in-cluster clients still use
      # http://aura:8080 over the aura-mezmo network (see web's AURA_BASE_URL).
      - "8081:8080"
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      CONFIG_PATH: "/app/config/aura.toml"

      # Streaming — the web UI now renders reasoning/tool-step events in a
      # separate, collapsed "Show reasoning" disclosure per message (see
      # web/public/index.html), distinct from the final synthesized answer,
      # so it's safe to actually emit that data instead of suppressing it
      # at the source like before. Per Aura's streaming API docs
      # (docs.mezmo.com/aura/streaming-api-guide):
      #   - AURA_CUSTOM_EVENTS=true enables aura.* events generally
      #     (aura.tool_requested/tool_start/reasoning/tool_complete/etc.)
      #   - AURA_EMIT_REASONING=true additionally enables aura.reasoning
      #     (the actual chain-of-thought text) -- requires CUSTOM_EVENTS too.
      #   - TOOL_RESULT_MODE=aura is the documented mode for "custom clients
      #     with AURA events": tool call args stream normally (same as
      #     `none`), and tool *results* stream via aura.tool_complete
      #     instead of not streaming at all.
      AURA_CUSTOM_EVENTS: "true"
      AURA_EMIT_REASONING: "true"
      TOOL_RESULT_MODE: "aura"

      # Blanked deliberately, overriding the value env_file pulls in from
      # .env. Aura must NOT hold the Mezmo credential: it now reaches Mezmo
      # only through mezmo-proxy, which enforces the production-only scope
      # and the read-only tool allowlist. If Aura kept the key it could
      # connect to mcp.mezmo.com directly and that enforcement would be
      # advisory rather than actual. mezmo-proxy holds the key instead.
      MEZMO_API_KEY: ""
    volumes:
      - ./config/aura.toml:/app/config/aura.toml:ro
      - ./config/skills:/app/skills:ro
    depends_on:
      logs-mcp:
        condition: service_healthy
      freshdesk-mcp:
        condition: service_healthy
      mezmo-proxy:
        condition: service_healthy
      fleet-status-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aura-mezmo

  # ── Uploaded-log tool server ─────────────────────────────────────────
  logs-mcp:
    build: ./services/logs-mcp
    container_name: aura-mezmo-logs-mcp
    ports:
      - "8091:8091"
    volumes:
      - logs-data:/data/uploads
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -sf http://localhost:8091/mcp -X POST
          -H "Content-Type: application/json"
          -H "Accept: application/json, text/event-stream"
          -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}},"id":1}'
          > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - aura-mezmo

  # ── Mezmo proxy — production-only, read-only gateway to mcp.mezmo.com ─
  # Aura points at this instead of at https://mcp.mezmo.com/mcp (see
  # config/aura.toml). It re-exposes a read-only subset of the 32 tools
  # Mezmo offers, and AND-injects a production-only, noise-filtered scope
  # into every query. The clause is deliberately not duplicated here --
  # the container prints it at startup and exposes a `describe_scope` tool.
  # It is the only container that gets MEZMO_API_KEY.
  mezmo-proxy:
    build: ./services/mezmo-proxy
    container_name: aura-mezmo-proxy
    ports:
      - "8093:8093"
    environment:
      # The only container that receives the Mezmo credential. Passed
      # explicitly rather than via `env_file: .env` so the proxy doesn't
      # also inherit LLM_API_KEY / FRESHDESK_API_KEY, which it has no use
      # for. Compose fails fast if it isn't set.
      MEZMO_API_KEY: "${MEZMO_API_KEY:?MEZMO_API_KEY must be set in .env}"

      # error | warn | off — what to do if a response carries a structural
      # `host` field outside the production scope. See server.py.
      TRIPWIRE_MODE: "error"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -sf http://localhost:8093/mcp -X POST
          -H "Content-Type: application/json"
          -H "Accept: application/json, text/event-stream"
          -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}},"id":1}'
          > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aura-mezmo

  # ── Fleet status — is a robot actually on right now? ─────────────────
  # Reads the ROC dashboard's existing HTTP API rather than re-running its
  # Tailscale + SSH polling here (see services/fleet-status-mcp/server.py
  # for why). The dashboard lives on the Tailnet; Docker Desktop resolves
  # MagicDNS, so `roc-ubu` answers from inside this container.
  fleet-status-mcp:
    build: ./services/fleet-status-mcp
    container_name: aura-mezmo-fleet-status
    ports:
      - "8094:8094"
    environment:
      ROC_DASHBOARD_URL: "${ROC_DASHBOARD_URL:-http://roc-ubu:3001}"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -sf http://localhost:8094/mcp -X POST
          -H "Content-Type: application/json"
          -H "Accept: application/json, text/event-stream"
          -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}},"id":1}'
          > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aura-mezmo

  # ── Freshdesk tool server ────────────────────────────────────────────
  freshdesk-mcp:
    build: ./services/freshdesk-mcp
    container_name: aura-mezmo-freshdesk-mcp
    ports:
      - "8092:8092"
    env_file: .env
    environment:
      # Blanked for the same reason as on `aura` and `web`: env_file pulls
      # in the whole .env and this container has no use for the Mezmo
      # credential. Only mezmo-proxy should hold it.
      MEZMO_API_KEY: ""
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl -sf http://localhost:8092/mcp -X POST
          -H "Content-Type: application/json"
          -H "Accept: application/json, text/event-stream"
          -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"1.0"}},"id":1}'
          > /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - aura-mezmo

  # ── Web control panel (upload + live logs + Freshdesk + chat UI) ────
  web:
    build: ./web
    container_name: aura-mezmo-web
    ports:
      - "8000:3000"
    env_file: .env
    environment:
      AURA_BASE_URL: "http://aura:8080"
      UPLOAD_DIR: "/data/uploads"
      SKILLS_DIR: "/app/skills"

      # Blanked for the same reason as on `aura`: env_file pulls in the
      # whole .env, and this container has no use for the Mezmo credential.
      # Only mezmo-proxy should hold it.
      MEZMO_API_KEY: ""
    volumes:
      - logs-data:/data/uploads
      # Read-write, unlike Aura's own read-only mount of the same host
      # directory below — this is what lets the "Skills" tab create/edit/
      # delete SKILL.md files. Aura only re-scans this directory at
      # startup, so changes need `docker compose restart aura` to go live.
      - ./config/skills:/app/skills
    depends_on:
      aura:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aura-mezmo

networks:
  aura-mezmo:

volumes:
  logs-data:
